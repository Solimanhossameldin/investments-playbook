name: Daily update and deploy

on:
  schedule:
    # 03:05 UTC every day, which is 07:05 Gulf Standard Time.
    - cron: "5 3 * * *"
    # FRED posts the daily Treasury curve around 20:15 UTC. A second pass at
    # 21:15 picks it up the same day instead of the next morning. The brief
    # generator sees an issue already exists for the date and skips.
    - cron: "15 21 * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Pull market data
        run: node scripts/fetch-market-data.mjs
        continue-on-error: true

      - name: Write today's brief
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: node scripts/generate-brief.mjs
        continue-on-error: true

      - name: Commit the day's content
        run: |
          git config user.name "Investments Playbook bot"
          git config user.email "bot@investmentsplaybook.com"
          git add content/
          if git diff --staged --quiet; then
            echo "Nothing changed today."
          else
            git commit -m "Daily update $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Build the site
        run: node scripts/build.mjs

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
