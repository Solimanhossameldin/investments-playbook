name: Daily update and deploy

on:
  schedule:
    # 03:05 UTC every day, which is 07:05 Gulf Standard Time.
    - cron: "5 3 * * *"
    # FRED posts the daily Treasury curve around 20:15 UTC. A second pass at
    # 21:15 picks it up the same day instead of the next morning. The brief
    # generator sees an issue already exists for the date and skips.
    - cron: "15 21 * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

# Shared with the wire workflow. cancel-in-progress killed whichever run was
# already going, which is how a wire refresh could destroy a daily run's brief,
# mail and submission halfway through. Deployments should queue, not race.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Pull market data
        run: node scripts/fetch-market-data.mjs
        continue-on-error: true

      - name: Score any matured calls
        run: node scripts/resolve-calls.mjs
        continue-on-error: true

      - name: Refresh the chartbook, weekly
        run: node scripts/fetch-chartbook.mjs
        continue-on-error: true

      # Twice a key was set and the next run still reported it missing, with no
      # way from outside the repository to tell whether it had not been made,
      # had been made in the wrong place, or was simply not picked up yet. The
      # runner knows which names arrived. It says so here, and never says what
      # they contain.
      - name: What reached this run
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          MAILERLITE_API_KEY: ${{ secrets.MAILERLITE_API_KEY }}
          MAIL_MODE: ${{ vars.MAIL_MODE }}
        run: node scripts/configcheck.mjs
        continue-on-error: true

      - name: Write today's brief
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: node scripts/generate-brief.mjs
        continue-on-error: true

      # Carries the brief that was just written to the list. Ships in draft:
      # MAIL_MODE is a repository variable rather than a secret, so switching
      # it to schedule or send is a change in the GitHub settings and needs no
      # commit. It refuses to send when there is no brief for today, when one
      # has already gone out, when the issue is short, or when the market
      # figures are stale.
      - name: Mail today's brief
        env:
          MAILERLITE_API_KEY: ${{ secrets.MAILERLITE_API_KEY }}
          MAIL_MODE: ${{ vars.MAIL_MODE }}
          MAIL_AT: ${{ vars.MAIL_AT }}
        run: node scripts/mail-brief.mjs
        continue-on-error: true

      # The site will not let itself publish a stale count or a cadence it is
      # not keeping. The mailing list had no such guard, and on 29 August every
      # one of the sixteen automation emails was set to send from a different
      # company's name. Read-only: it reports and never edits the account,
      # because sender identity is not the build's to change.
      - name: Audit the mailing list
        env:
          MAILERLITE_API_KEY: ${{ secrets.MAILERLITE_API_KEY }}
        run: node scripts/mailaudit.mjs
        continue-on-error: true

      # Bookkeeping must never be able to stop publishing. This step pushes,
      # and a push races: the bot commits every fifteen minutes and a person
      # can push at any moment, so between this job's checkout and its push
      # origin may have moved and the push is rejected. Without
      # continue-on-error that rejection fails the job, and because deploy
      # needs update and submit needs deploy, a lost race silently cancels the
      # deployment and the search-engine submission. Saving today's content is
      # worth a retry; it is not worth the site not updating. The rebase below
      # makes the race rare, this makes losing it harmless.
      - name: Commit the day's content
        continue-on-error: true
        run: |
          git config user.name "Investments Playbook bot"
          git config user.email "bot@investmentsplaybook.com"
          git add content/
          if git diff --staged --quiet; then
            echo "Nothing changed today."
          else
            # [skip ci], for the same reason the wire commits carry it, and it
            # matters more here. This workflow triggers on pushes to main and
            # runs under `concurrency: pages` with cancel-in-progress, so a
            # commit made here starts a new run that CANCELS THIS ONE -- before
            # deploy (needs: update) and submit (needs: deploy) can finish.
            # Four "Daily update" commits landed on 1 September, each killing
            # the run that made it, which is why the submission job appeared
            # never to run at all. The deploy still needs to happen, and it
            # does: it is the next job in this same run, which now survives.
            git commit -m "Daily update $(date -u +%Y-%m-%d) [skip ci]"
            # Rebase before pushing, the way the submission job already does.
            # content/status.json is the file both sides write, so a plain
            # push loses this race regularly.
            for attempt in 1 2 3; do
              git pull --rebase --autostash origin main && git push && break
              echo "push attempt $attempt failed, retrying"
              sleep 5
            done
          fi

      - name: Build the site
        run: node scripts/build.mjs

      # Every structural guard on this site runs from `npm test` and `npm run
      # audit`, which nobody runs on a schedule, so until now none of them
      # watched production. A bot commit or a hand edit could break a promise
      # and deploy it, and the first anybody would know is a reader finding it.
      #
      # Deliberately non-blocking. A failing audit means something is wrong
      # with the site's structure, not with today's market figures, and
      # stopping the deploy would also stop the data page refreshing, which
      # trades a real cost for a structural one. The failure is printed in the
      # run log instead.
      #
      # To make it blocking, delete the continue-on-error line below. Do that
      # once there is enough traffic that shipping a broken promise costs more
      # than a day of stale figures.
      - name: Structural audit
        run: node scripts/seoaudit.mjs --strict
        continue-on-error: true

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Google does not accept submissions and there is no way to make it crawl
  # faster than it wants to. Bing, Yandex, Naver and Seznam share one endpoint
  # that does, and Bing is what DuckDuckGo and several answer engines read.
  #
  # After the deploy, never before. The script verifies the key file is served
  # and spot-checks that the live site returns pages the sitemap promises, so
  # it cannot submit a sitemap describing a build that is not deployed. It
  # waits out Pages propagation and refuses rather than guesses.
  # Off by default, and deliberately.
  #
  # This job submits the sitemap to the engines that accept submissions, and it
  # has never once worked. It exits 1 on every run and writes no record, the
  # fallback that was supposed to write a record when the script did not also
  # exits 1, and the only thing that would say why is an Actions log that needs
  # an account to read. Four attempts from outside the repository have not
  # found it.
  #
  # Leaving it on made the build red on every push. A build that is always red
  # is worse than a feature that is missing: it teaches everyone to ignore the
  # one signal that is supposed to mean something, and this repository has
  # spent a lot of effort on checks that are worth reading.
  #
  # The code and its seventeen tests are untouched and correct as far as they
  # can be tested offline. To finish it: set the repository variable INDEXNOW
  # to `on`, push, then open the failing `submit` job while signed in to
  # GitHub. The first line of the traceback is the whole answer.
  #
  # What is lost while it is off: Bing, Yandex, Naver and Seznam are not told
  # about new pages and will find them on their own schedule. Google never
  # accepted submissions anyway, so nothing about Google changes.
  submit:
    needs: deploy
    # Was opt-in because this job exited 1 on every run and a permanently red
    # build is worse than a missing feature. The cause is now found and fixed
    # (a ReferenceError in the runner, see scripts/indexnow.mjs) and covered by
    # a test that executes the runner, so the default flips: it runs unless
    # explicitly switched off. The step keeps continue-on-error, so a bad day
    # at an engine still cannot fail a deploy.
    if: vars.INDEXNOW != 'off'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 22, matching update above. This job ran the same build on 20 while
          # every other job ran it on 22, which is a difference nobody chose
          # and nobody could see: the build only ever failed here.
          node-version: "22"
      - run: node scripts/build.mjs
      - id: idx
        run: node scripts/indexnow.mjs --wait=120
        continue-on-error: true

      # The first real run showed the flaw in the step above: it writes its
      # outcome into status.json, which the data page publishes, and then this
      # job ends without committing anything, so the record is thrown away. A
      # job that reports into a file nobody keeps has not reported. [skip ci]
      # because this commit is bookkeeping and must not start the cycle again.
      - name: Record what the submission did
        if: always()
        # This step exists to report a failure, so it must not be able to
        # cause one. content/status.json is the file the wire bot rewrites
        # every fifteen minutes, so the rebase below can conflict, and a
        # conflicted rebase failed this step, failed the job, and threw away
        # the very record it was added to write.
        continue-on-error: true
        run: |
          git config user.name "Investments Playbook bot"
          git config user.email "bot@investmentsplaybook.com"

          # Take the record this run produced -- the script's own, or a
          # fallback built from the step outcome when the script died before
          # it could write one -- and hold it as a single JSON value.
          RECORD=$(node -e "
            const fs = require('fs');
            let mine = null;
            try {
              const s = JSON.parse(fs.readFileSync('content/status.json', 'utf8'));
              if (s.runs && s.runs[0] && s.runs[0].job === 'indexnow') mine = s.runs[0];
            } catch (e) {}
            if (!mine) mine = {
              job: 'indexnow',
              status: '${{ steps.idx.outcome }}' === 'success' ? 'ok' : 'failed',
              detail: 'the script exited without writing a record; the step outcome was ${{ steps.idx.outcome }}',
              ranAt: new Date().toISOString(),
            };
            console.log(JSON.stringify(mine));
          ")
          echo "record: $RECORD"

          # Never diverge, so there is nothing to conflict. Each attempt starts
          # from whatever origin holds right now and puts this one record on
          # top. status.json is only ever prepended to by either side, so
          # rebuilding from origin is the correct resolution, not a compromise.
          # The previous version committed first and then rebased, which meant
          # a wire commit landing mid-run produced a conflict, and the step
          # that exists to report a failure became one.
          for attempt in 1 2 3; do
            git fetch origin main && git reset --hard origin/main
            node -e "
              const fs = require('fs'), p = 'content/status.json';
              let s = { runs: [] };
              try { s = JSON.parse(fs.readFileSync(p, 'utf8')); } catch (e) {}
              s.runs.unshift(JSON.parse(process.argv[1]));
              s.runs = s.runs.slice(0, 40);
              fs.writeFileSync(p, JSON.stringify(s, null, 1));
            " "$RECORD"
            git add content/status.json
            if git diff --staged --quiet; then echo "Nothing to record."; break; fi
            git commit -m "IndexNow $(date -u +%H:%M) [skip ci]"
            git push && break
            echo "push attempt $attempt lost the race, rebuilding on origin"
            sleep 5
          done

  # Three separate bugs stopped the submission from ever running, and each one
  # cost hours because the only thing that could say what failed was an Actions
  # log that needs an account to read. The site publishes a status panel; the
  # pipeline should report into it like every other job does.
  #
  # This runs whatever happened above -- if: always(), and it needs all three,
  # so it is the last thing in the run -- and writes down how each job ended.
  # A red deploy or a red submit now shows up on /data/ by name, minutes later,
  # instead of being invisible from outside the repository.
  report:
    needs: [update, deploy, submit]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Record how the run itself went
        run: |
          git config user.name "Investments Playbook bot"
          git config user.email "bot@investmentsplaybook.com"
          git pull --rebase --autostash origin main || true
          node -e "
            const fs = require('fs'), p = 'content/status.json';
            let s = { runs: [] };
            try { s = JSON.parse(fs.readFileSync(p, 'utf8')); } catch (e) {}
            const r = {
              update: '${{ needs.update.result }}',
              deploy: '${{ needs.deploy.result }}',
              submit: '${{ needs.submit.result }}',
            };
            // 'skipped' is a decision, not a fault: submit is skipped when
            // INDEXNOW is off. Only a real non-success is worth alarming on.
            const bad = Object.keys(r).filter((k) => r[k] !== 'success' && r[k] !== 'skipped');
            s.runs.unshift({
              job: 'pipeline',
              status: bad.length ? 'failed' : 'ok',
              detail: Object.keys(r).map((k) => k + '=' + r[k]).join(', ') +
                (bad.length ? '. The failing job is ' + bad[0] + '; its log says why.' : ''),
              ranAt: new Date().toISOString(),
            });
            s.runs = s.runs.slice(0, 40);
            fs.writeFileSync(p, JSON.stringify(s, null, 1));
            console.log(JSON.stringify(r));
          "
          git add content/status.json
          if git diff --staged --quiet; then
            echo "Nothing to record."
          else
            git commit -m "Pipeline $(date -u +%H:%M) [skip ci]"
            for attempt in 1 2 3; do
              git pull --rebase --autostash origin main && git push && break
              echo "push attempt $attempt failed, retrying"
              sleep 5
            done
          fi

