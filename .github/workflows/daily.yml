name: Daily update and deploy

on:
  schedule:
    # 03:05 UTC every day, which is 07:05 Gulf Standard Time.
    - cron: "5 3 * * *"
    # FRED posts the daily Treasury curve around 20:15 UTC. A second pass at
    # 21:15 picks it up the same day instead of the next morning. The brief
    # generator sees an issue already exists for the date and skips.
    - cron: "15 21 * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Pull market data
        run: node scripts/fetch-market-data.mjs
        continue-on-error: true

      - name: Score any matured calls
        run: node scripts/resolve-calls.mjs
        continue-on-error: true

      - name: Refresh the chartbook, weekly
        run: node scripts/fetch-chartbook.mjs
        continue-on-error: true

      - name: Write today's brief
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: node scripts/generate-brief.mjs
        continue-on-error: true

      # Carries the brief that was just written to the list. Ships in draft:
      # MAIL_MODE is a repository variable rather than a secret, so switching
      # it to schedule or send is a change in the GitHub settings and needs no
      # commit. It refuses to send when there is no brief for today, when one
      # has already gone out, when the issue is short, or when the market
      # figures are stale.
      - name: Mail today's brief
        env:
          MAILERLITE_API_KEY: ${{ secrets.MAILERLITE_API_KEY }}
          MAIL_MODE: ${{ vars.MAIL_MODE }}
          MAIL_AT: ${{ vars.MAIL_AT }}
        run: node scripts/mail-brief.mjs
        continue-on-error: true

      # The site will not let itself publish a stale count or a cadence it is
      # not keeping. The mailing list had no such guard, and on 29 August every
      # one of the sixteen automation emails was set to send from a different
      # company's name. Read-only: it reports and never edits the account,
      # because sender identity is not the build's to change.
      - name: Audit the mailing list
        env:
          MAILERLITE_API_KEY: ${{ secrets.MAILERLITE_API_KEY }}
        run: node scripts/mailaudit.mjs
        continue-on-error: true

      - name: Commit the day's content
        run: |
          git config user.name "Investments Playbook bot"
          git config user.email "bot@investmentsplaybook.com"
          git add content/
          if git diff --staged --quiet; then
            echo "Nothing changed today."
          else
            git commit -m "Daily update $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Build the site
        run: node scripts/build.mjs

      # Every structural guard on this site runs from `npm test` and `npm run
      # audit`, which nobody runs on a schedule, so until now none of them
      # watched production. A bot commit or a hand edit could break a promise
      # and deploy it, and the first anybody would know is a reader finding it.
      #
      # Deliberately non-blocking. A failing audit means something is wrong
      # with the site's structure, not with today's market figures, and
      # stopping the deploy would also stop the data page refreshing, which
      # trades a real cost for a structural one. The failure is printed in the
      # run log instead.
      #
      # To make it blocking, delete the continue-on-error line below. Do that
      # once there is enough traffic that shipping a broken promise costs more
      # than a day of stale figures.
      - name: Structural audit
        run: node scripts/seoaudit.mjs --strict
        continue-on-error: true

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Google does not accept submissions and there is no way to make it crawl
  # faster than it wants to. Bing, Yandex, Naver and Seznam share one endpoint
  # that does, and Bing is what DuckDuckGo and several answer engines read.
  #
  # After the deploy, never before. The script verifies the key file is served
  # and spot-checks that the live site returns pages the sitemap promises, so
  # it cannot submit a sitemap describing a build that is not deployed. It
  # waits out Pages propagation and refuses rather than guesses.
  submit:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node scripts/build.mjs
      - id: idx
        run: node scripts/indexnow.mjs --wait=120
        continue-on-error: true

      # The first real run showed the flaw in the step above: it writes its
      # outcome into status.json, which the data page publishes, and then this
      # job ends without committing anything, so the record is thrown away. A
      # job that reports into a file nobody keeps has not reported. [skip ci]
      # because this commit is bookkeeping and must not start the cycle again.
      - name: Record what the submission did
        if: always()
        run: |
          git config user.name "Investments Playbook bot"
          git config user.email "bot@investmentsplaybook.com"
          # Three runs in a row exited 1 and left status.json untouched, so the
          # script is dying somewhere before it can write its own outcome and
          # the only trace is an Actions log that needs an account to read.
          # Trusting the reporter to report is the mistake. The job knows
          # whether the step succeeded either way, so it writes that down when
          # the script did not.
          node -e "
            const fs = require('fs'), p = 'content/status.json';
            const s = JSON.parse(fs.readFileSync(p, 'utf8'));
            if (s.runs[0] && s.runs[0].job === 'indexnow') { console.log('the script recorded its own outcome'); process.exit(0); }
            s.runs.unshift({ job: 'indexnow', status: '${{ steps.idx.outcome }}' === 'success' ? 'ok' : 'failed',
              detail: 'the script exited without writing a record; the step outcome was ${{ steps.idx.outcome }}',
              ranAt: new Date().toISOString() });
            s.runs = s.runs.slice(0, 40);
            fs.writeFileSync(p, JSON.stringify(s, null, 1));
            console.log('wrote a fallback record');"
          git add content/status.json
          if git diff --staged --quiet; then
            echo "Nothing to record."
          else
            git commit -m "IndexNow $(date -u +%H:%M) [skip ci]"
            git pull --rebase --autostash origin main
            git push
          fi
