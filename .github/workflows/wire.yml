name: Wire refresh

on:
  schedule:
    # Every quarter hour. GitHub queues scheduled runs, so the honest cadence is
    # roughly fifteen to thirty minutes rather than exactly fifteen.
    - cron: "*/15 * * * *"
  workflow_dispatch:

# The daily job deploys Pages too. Let whichever is running finish rather than
# having two deployments race.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  wire:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Pull the wire
        run: node scripts/fetch-wire.mjs
        continue-on-error: true

      - name: Stop here if nothing new came in
        id: diff
        run: |
          if git diff --quiet -- content/wire.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No new items, so no build and no deploy."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "Investments Playbook bot"
          git config user.email "bot@investmentsplaybook.com"
          git add content/wire.json content/status.json
          # skip ci, because this workflow does its own build and deploy and the
          # daily job must not re-run its market pull ninety six times a day.
          git commit -m "Wire refresh $(date -u +%H:%M) [skip ci]"
          git pull --rebase origin main
          git push origin main

      - name: Build the site
        if: steps.diff.outputs.changed == 'true'
        run: node scripts/build.mjs

      - uses: actions/configure-pages@v5
        if: steps.diff.outputs.changed == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: steps.diff.outputs.changed == 'true'
        with:
          path: dist

  deploy:
    needs: wire
    if: needs.wire.outputs.changed == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
